              serif: ['Times New Roman', 'serif'], // For Print

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc; /* Very light slate background */
      }
      
      /* Base Responsive Image Style */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      
      /* Professional Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 10mm; /* Adjusted margins for standard A4 printing */
        }
        
        /* Force Light Mode Global Overrides for A4 */
        html, body, #root {
          height: auto !important;
          overflow: visible !important;
          background-color: #ffffff !important;
          color: #000000 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          font-family: 'Times New Roman', serif !important; /* Official Font */
        }

        /* Override Dark Mode Backgrounds specifically */
        .dark, [class*="dark:"] {
            background-color: transparent !important;
            color: black !important;
            border-color: #000 !important;
        }
        
        /* Force white backgrounds on cards */
        .bg-white, .dark\:bg-slate-800, .bg-slate-50, .bg-slate-900, .bg-brand-900 {
            background-color: #ffffff !important;
        }
        
        /* Ensure text is black */
        .text-white, .text-slate-200, .text-gray-200, .dark\:text-white {
            color: #000000 !important;
        }

        /* Hide UI elements */
        .no-print, nav, aside, button, .shadow-academic, header {
          display: none !important;
        }

        /* Force all elements to white background and black text */
        *, *::before, *::after {
          box-shadow: none !important;
          text-shadow: none !important;
        }

        /* Specific Table Styling for Print */
        table {
            width: 100% !important;
            border-collapse: collapse !important;
            border: 1px solid #000 !important; /* Thinner border for cleaner print */
            font-size: 11pt !important;
        }
        th, td {
            border: 1px solid #000 !important;
            padding: 4px 8px !important;
            color: black !important;
        }
        
        /* Headers specific overrides */
        .print-header-bg {
            background-color: #e5e7eb !important; /* Light Gray for print headers */
            font-weight: bold !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        /* Ensure logos print clearly and consistently */
        img {
            filter: none !important; 
            opacity: 1 !important;
            page-break-inside: avoid !important;
            max-width: 100% !important;
            height: auto !important;
        }

        /* Table header/footer repetition on new pages */
        thead {
            display: table-header-group;
        }
        tfoot {
            display: table-footer-group;
        }
        tr {
            page-break-inside: avoid;
        }

        /* Ensure links don't show URLs */
        a[href]:after {
            content: none !important;
        }

        #root {
          position: relative;
          z-index: 1;
        }
      }
    </style>
